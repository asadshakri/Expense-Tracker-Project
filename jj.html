<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f5f8;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
    }
    .filters {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }
    .filters button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #007bff;
      color: #fff;
      transition: 0.2s;
    }
    .filters button:hover {
      background-color: #0056b3;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    table th, table td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    table th {
      background-color: #007bff;
      color: #fff;
    }
    #downloadBtn {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #28a745;
      color: #fff;
      font-size: 16px;
      transition: 0.2s;
    }
    #downloadBtn:disabled {
      background-color: gray;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Premium Expenses & Income Dashboard</h2>

    <div class="filters">
      <button id="dailyBtn">Daily</button>
      <button id="weeklyBtn">Weekly</button>
      <button id="monthlyBtn">Monthly</button>
    </div>

    <table id="transactionsTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Type</th>
          <th>Category</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody>
        <!-- Transactions will appear here -->
      </tbody>
    </table>

    <button id="downloadBtn">Download Transactions</button>
  </div>

  <script>
    // Example data
    const transactions = [
      { date: '2025-10-01', type: 'Expense', category: 'Food', amount: 20 },
      { date: '2025-10-01', type: 'Income', category: 'Salary', amount: 2000 },
      { date: '2025-10-02', type: 'Expense', category: 'Transport', amount: 15 },
      { date: '2025-10-05', type: 'Expense', category: 'Shopping', amount: 50 },
      { date: '2025-10-06', type: 'Income', category: 'Freelance', amount: 500 }
    ];

    // Premium flag
    const isPremium = true; // change to false to test non-premium behavior
    const tableBody = document.querySelector("#transactionsTable tbody");
    const downloadBtn = document.getElementById("downloadBtn");

    if (!isPremium) downloadBtn.disabled = true;

    // Display transactions in table
    function displayTransactions(data) {
      tableBody.innerHTML = "";
      data.forEach(tx => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${tx.date}</td>
          <td>${tx.type}</td>
          <td>${tx.category}</td>
          <td>${tx.amount}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    displayTransactions(transactions);

    // Filter functions
    function filterDaily() {
      const today = new Date().toISOString().split('T')[0];
      displayTransactions(transactions.filter(tx => tx.date === today));
    }

    function filterWeekly() {
      const now = new Date();
      const weekStart = new Date(now.setDate(now.getDate() - now.getDay()));
      displayTransactions(transactions.filter(tx => new Date(tx.date) >= weekStart));
    }

    function filterMonthly() {
      const now = new Date();
      displayTransactions(transactions.filter(tx => new Date(tx.date).getMonth() === now.getMonth()));
    }

    document.getElementById("dailyBtn").addEventListener("click", filterDaily);
    document.getElementById("weeklyBtn").addEventListener("click", filterWeekly);
    document.getElementById("monthlyBtn").addEventListener("click", filterMonthly);

    // Download CSV
    downloadBtn.addEventListener("click", () => {
      if (!isPremium) return;

      const csvContent = "data:text/csv;charset=utf-8,"
        + ["Date,Type,Category,Amount"]
          .concat(transactions.map(tx => `${tx.date},${tx.type},${tx.category},${tx.amount}`))
          .join("\n");

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "transactions.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</body>
</html>
