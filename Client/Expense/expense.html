<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
   <div class="container abc">
    <form onsubmit="handleSubmit(event)" class="form-control form">
        <label for="expenseamount" class="form-label">ExpenseAmount</label>
        <input type="number" class="form-control" id="expenseamount" name="expenseamount" required>
        <br>
        <label for="description" class="form-label">Description</label>
        <input type="text" class="form-control" id="description" name="description" required>
        <br>
        <label for="category" class="form-label">Category</label>
        <select class="form-select" id="category" name="category" required>
            <option value="Choose" disabled selected>Select a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Utilities">Utilities</option>
            <option value="Healthcare">Healthcare</option>
        </select>
        <br>
        <div class="d-grid gap-2 col-6 mx-auto">
        <button type="submit" class="btn btn-danger mt-3" id="btn">Add Expense</button>
        </div>
    </form>
   </div>
   <div>
    <ul></ul>
   </div>
    
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
<script src="index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</html>
