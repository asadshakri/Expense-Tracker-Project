<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div style="display: flex;">
  
    <div class="d-inline-flex">
        <!-- Sidebar -->
        <nav class="navbar navbar-dark bg-dark align-items-start flex-column p-3" style="min-height: 100vh; width: 250px;">
          <a class="navbar-brand fw-bold mb-4 fs-4 text-white" href="#">💰 Expense Tracker</a>
          <div class="mb-3">
            <h3 class="text-white mb-1">Welcome!</h3>
            <p id="premiumStatus" style="display: none; color: aliceblue; font-size: small;font-style: oblique;">You are our premium member</p>
            <button 
              type="button" 
              onclick="buyPremium()" 
              id="premium" 
              class="btn btn-danger btn-sm w-100 mt-3">
              ⭐ Buy Premium Membership
            </button>
          </div>
       
          <ul class="nav nav-pills flex-column w-100">
            <li class="nav-item mb-2">
                <button class="btn btn-dark  w-100 text-start" onclick="home()">Home</button>
              </li>
            <li class="nav-item mb-2">
              <button class="btn btn-dark  w-100 text-start" onclick="addExpense()">Add Expense</button>
            </li>
            <li class="nav-item mb-2">
              <button class="btn btn-dark  w-100 text-start" onclick="showExpense()">Expense Details</button>
            </li>
            <li class="nav-item mb-2">
              <button id="leaderButton" class="btn btn-dark  w-100 text-start" onclick="showLeaderboard()" disabled>Leaderboard</button>
            </li>
            <br><br>
            <li class="nav-item mb-2">
                <button class="btn btn-dark  w-100 text-start" onclick="logout()">Log Out</button>
              </li>
            
          </ul>
        </nav>
    </div>
 
   <div class="container abc" id="expenseForm" >
    <form onsubmit="handleSubmit(event)" class="form-control form">
        <label for="expenseamount" class="form-label">ExpenseAmount</label>
        <input type="number" class="form-control" id="expenseamount" name="expenseamount" required>
        <br>
        <label for="category" class="form-label">Category</label>
        <select class="form-select" id="category" name="category" required>
            <option value="Choose" disabled selected>Select a category</option>
            <option value="food">food</option>
            <option value="transport">transport</option>
            <option value="entertainment">entertainment</option>
            <option value="utilities">utilities</option>
            <option value="healthcare">healthcare</option>
            <option value="others">others</option>
        </select>
        <br>
        <label for="description" class="form-label">Description</label>
        <textarea type="text" rows="5" cols="20" class="form-control" id="description" name="description" required></textarea>
        <br>
      
        
        <div class="d-grid gap-2 col-6 mx-auto">
        <button type="submit" class="btn btn-danger mt-3" id="btn">Add Expense</button>
        </div>
    </form>
   </div>

   <div class="abc" id="showExpense">
       <ul id="ul">

       </ul>
   </div>
   <div class="abc" id="showLeaderboard">
    <div id="ul_leader"></div>
   </div>
    </div>

    
    
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
<script src="index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</html>
